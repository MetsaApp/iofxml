name: Release Please

# Opens and updates the release pull request from the Conventional Commits
# on main. Merging it tags the release and updates CHANGELOG.md. A Go
# module needs nothing more: the tag is the release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
